<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlueShare - Prototipo Tablet Portrait</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
      }

      body {
        background-color: #f1f5f9;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }

      /* Marco de Tablet en Portrait (Vertical) */
      .tablet-frame-portrait {
        width: 600px;
        height: 850px;
        background: #ffffff;
        border-radius: 32px;
        box-shadow: 0 16px 40px rgba(15, 23, 42, 0.18);
        border: 8px solid #0f172a;
        display: flex;
        flex-direction: column;
        position: relative;
        overflow: hidden;
      }

      /* Header Fijo adaptado a Tablet */
      .header {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 75px;
        background-color: #ffffff;
        border-bottom: 2px solid #e2e8f0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        z-index: 10;
      }

      .btn-menu {
        background: #f0f7ff;
        border: 2px solid #0084ff;
        border-radius: 10px;
        padding: 8px 12px;
        font-size: 20px;
        cursor: pointer;
        font-weight: bold;
        color: #0084ff;
      }

      .search-title-box {
        flex: 0 1 350px;
        position: relative;
      }

      .search-input {
        width: 100%;
        height: 46px;
        border: 2px solid #0f172a;
        border-radius: 12px;
        padding: 0 16px;
        font-size: 17px;
        font-weight: 700;
        color: #0f172a;
        background-color: #f8fafc;
        text-align: center;
      }

      .search-input:focus {
        outline: none;
        border-color: #0084ff;
        background-color: #ffffff;
        text-align: left;
      }

      .user-avatar {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        border: 2px solid #0f172a;
        background-color: #fdf6f0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
      }

      /* Contenedor Feed centrado con mayor ancho para tablet */
      .feed-container {
        flex: 1;
        margin-top: 75px;
        margin-bottom: 80px;
        overflow-y: auto;
        padding: 20px 32px;
        background-color: #faf9f6;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* Tarjetas optimizadas para el ancho de tablet */
      .card {
        width: 100%;
        max-width: 500px;
        background: white;
        border: 2px solid #e2e8f0;
        border-radius: 18px;
        padding: 20px;
        margin-bottom: 20px;
        box-shadow: 0 3px 8px rgba(15, 23, 42, 0.04);
      }

      .card-event {
        border: 2px solid #0f172a;
        border-left: 6px solid #0084ff;
      }

      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 14px;
      }

      .card-title {
        font-size: 20px;
        font-weight: 800;
        color: #0f172a;
      }

      .category-badge {
        background-color: #e0f2fe;
        color: #0369a1;
        padding: 5px 12px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 700;
        border: 1px solid #bae6fd;
      }

      .carousel-container {
        display: flex;
        gap: 10px;
        overflow-x: auto;
        padding-bottom: 8px;
        margin-bottom: 14px;
        scrollbar-width: thin;
      }

      .carousel-item {
        min-width: 120px;
        height: 100px;
        background-color: #f1f5f9;
        border-radius: 10px;
        border: 1px solid #cbd5e1;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        color: #475569;
        flex-shrink: 0;
        font-weight: 600;
      }

      .card-text {
        font-size: 16px;
        color: #334155;
        line-height: 1.5;
        margin-bottom: 14px;
      }

      .card-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        border-top: 1px solid #f1f5f9;
        padding-top: 12px;
      }

      .btn-action {
        background-color: #f8fafc;
        border: 1px solid #cbd5e1;
        padding: 6px 16px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 700;
        color: #0f172a;
        cursor: pointer;
      }

      /* Caja de Creación para Tablet */
      .creation-box {
        width: 100%;
        max-width: 500px;
        border: 2px dashed #0084ff;
        background-color: #f0f7ff;
        border-radius: 18px;
        padding: 16px;
        margin-bottom: 20px;
        display: none;
      }
      .creation-box.active {
        display: block;
      }
      .select-type {
        width: 100%;
        height: 44px;
        border: 2px solid #0f172a;
        border-radius: 10px;
        padding: 0 12px;
        font-size: 15px;
        font-weight: 600;
        background: white;
        color: #0f172a;
        margin-bottom: 10px;
      }
      .btn-create-submit {
        width: 100%;
        height: 42px;
        background-color: #0084ff;
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
      }

      /* Botón Flotante ajustado */
      .fab-button {
        position: absolute;
        bottom: 95px;
        right: 28px;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background-color: #0084ff;
        color: white;
        border: 3px solid #ffffff;
        font-size: 30px;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 14px rgba(0, 132, 255, 0.35);
        cursor: pointer;
        z-index: 15;
      }

      /* Footer Fijo en Tablet */
      .footer {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 80px;
        background-color: #ffffff;
        border-top: 2px solid #e2e8f0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 0 24px;
        z-index: 10;
      }

      .footer-tab {
        width: 150px;
        height: 48px;
        background-color: #f8fafc;
        border: 2px solid #cbd5e1;
        border-radius: 12px;
        color: #334155;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .footer-tab.active {
        background-color: #0084ff;
        border-color: #006fe6;
        color: #ffffff;
        box-shadow: 0 3px 8px rgba(0, 132, 255, 0.3);
      }
    </style>
  </head>
  <body>
    <div class="tablet-frame-portrait">
      <!-- Header Fijo -->
      <header class="header">
        <button class="btn-menu" aria-label="Menú">≡</button>
        <div class="search-title-box">
          <input
            type="text"
            class="search-input"
            value="BlueShare"
            id="searchInput"
            placeholder="Buscar..."
          />
        </div>
        <div class="user-avatar" title="Perfil">👵</div>
      </header>

      <!-- Contenido Scrollable -->
      <main class="feed-container">
        <!-- Caja Desplegable de Creación -->
        <div class="creation-box" id="creationBox">
          <p
            style="
              font-size: 14px;
              font-weight: bold;
              margin-bottom: 8px;
              color: #0f172a;
            "
          >
            Crear nuevo elemento:
          </p>
          <select class="select-type">
            <option value="event">📅 Evento</option>
            <option value="text">📝 Texto</option>
            <option value="image">📷 Imagen</option>
          </select>
          <button class="btn-create-submit" onclick="toggleCreationBox()">
            Publicar
          </button>
        </div>

        <!-- Item 1: Evento Destacado -->
        <article class="card card-event">
          <div class="card-header">
            <h2 class="card-title">Tarde de juegos y café</h2>
            <span class="category-badge">Encuentro</span>
          </div>

          <div class="carousel-container">
            <div class="carousel-item">Foto 1 ☕</div>
            <div class="carousel-item">Foto 2 🧩</div>
            <div class="carousel-item">Foto 3 🍰</div>
            <div class="carousel-item">+ Ver más</div>
          </div>

          <p class="card-text">
            Nos reuniremos en el salón principal este jueves a las 17:00 para
            compartir un buen rato jugando al parchís y merendar juntos.
          </p>

          <div class="card-actions">
            <button class="btn-action">Editar</button>
            <button class="btn-action">Compartir</button>
          </div>
        </article>
      </main>

      <!-- Botón Flotante -->
      <button class="fab-button" onclick="toggleCreationBox()" title="Crear">
        +
      </button>

      <!-- Footer Fijo -->
      <nav class="footer">
        <button class="footer-tab active">Timeline</button>
        <button class="footer-tab">Circles</button>
        <button class="footer-tab">Events</button>
      </nav>
    </div>

    <script>
      function toggleCreationBox() {
        const box = document.getElementById("creationBox");
        box.classList.toggle("active");
      }
    </script>
  </body>
</html>
